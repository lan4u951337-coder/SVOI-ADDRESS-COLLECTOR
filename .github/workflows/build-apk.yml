name: Build and sign SVOI address collector 0.8.4

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Public repository only. No VPS credentials, no production deployment.
permissions:
  contents: read

concurrency:
  group: standalone-collector-apk
  cancel-in-progress: false

jobs:
  apk:
    outputs:
      signing_ready: ${{ steps.signing_gate.outputs.ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Check public-only source and prevent accidental private files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allow={
            '.github/workflows/build-apk.yml','.gitignore','README.md',
            '.github/workflows/validate-collector-signing.yml',
            'package.json','android-driver/settings.gradle.kts',
            'android-driver/build.gradle.kts','android-driver/gradle.properties',
            'android-driver/address-collector/build.gradle.kts',
            'android-driver/address-collector/src/main/AndroidManifest.xml',
            'android-driver/address-collector/src/main/res/xml/collector_update_paths.xml',
            'android-driver/address-collector/src/main/res/drawable-nodpi/svoi_collector_icon.png',
            'android-driver/address-collector/src/main/assets/address-core.js',
            'android-driver/address-collector/src/main/assets/collector.css',
            'android-driver/address-collector/src/main/assets/collector.html',
            'android-driver/address-collector/src/main/assets/collector.js',
            'android-driver/address-collector/src/main/assets/gps-quality.js',
            'android-driver/address-collector/src/main/assets/team-sync.js',
            'android-driver/address-collector/src/main/java/ru/svoitaxi/addresscollector/CollectorActivity.java',
            'android-driver/address-collector/src/main/java/ru/svoitaxi/addresscollector/CollectorUpdater.java',
            'tests/address-collector-map-save-ui.test.mjs',
            'tests/address-collector-owner.test.mjs',
            'tests/collector-brand-release.test.mjs',
            'tests/collector-inapp-update.test.mjs',
            'tests/collector-operator-deletion-sync.test.mjs'
          }
          actual=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          extra=actual-allow
          missing=allow-actual
          if extra or missing:
            raise SystemExit(f'PUBLIC_BUNDLE_REFUSED extra={sorted(extra)} missing={sorted(missing)}')
          print('PUBLIC_COLLECTOR_SOURCE_ALLOWLIST_PASSED')
          PY
          ! git ls-files | grep -Ei '(^|/)(\.env|secrets|database|prod|backend|server|api|deploy|driver|client)(/|$)' || {
            echo 'Unexpected private material'; exit 1;
          }

      - name: Verify approved SVOI address pin launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON=android-driver/address-collector/src/main/res/drawable-nodpi/svoi_collector_icon.png
          test -s "$ICON"
          test "$(git hash-object "$ICON")" = 2940c67071b6431bbacce66556dc832fc7b7e4f1
          echo 'SVOI_APPROVED_ADDRESS_PIN_ICON_VERIFIED'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK and pinned public map library
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          npm install --ignore-scripts --no-audit --no-fund
          test "$(wc -c < node_modules/maplibre-gl/dist/maplibre-gl.js)" -gt 200000
          test "$(wc -c < node_modules/maplibre-gl/dist/maplibre-gl.css)" -gt 2000

      - name: Run Android collector regression checks
        shell: bash
        run: |
          set -euo pipefail
          for file in android-driver/address-collector/src/main/assets/*.js; do node --check "$file"; done
          node --test tests/address-collector-owner.test.mjs tests/address-collector-map-save-ui.test.mjs tests/collector-brand-release.test.mjs tests/collector-inapp-update.test.mjs tests/collector-operator-deletion-sync.test.mjs

      - name: Build only standalone address-collector APK
        working-directory: android-driver
        shell: bash
        run: |
          set -euo pipefail
          gradle :address-collector:assembleDebug --no-daemon --max-workers=2 --no-parallel

      - name: Check APK identity and bundled map
        shell: bash
        run: |
          set -euo pipefail
          APK=android-driver/address-collector/build/outputs/apk/debug/address-collector-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='ru.svoitaxi.collector'"
          python3 - <<'PY'
          from zipfile import ZipFile
          p='android-driver/address-collector/build/outputs/apk/debug/address-collector-debug.apk'
          with ZipFile(p) as z:
            required=['assets/collector.html','assets/collector.css','assets/collector.js',
              'assets/team-sync.js','assets/address-core.js','assets/gps-quality.js',
              'assets/maplibre-gl.js','assets/maplibre-gl.css']
            for f in required: assert f in z.namelist(),f
            js=z.read('assets/collector.js')
            assert b'renderHouseNumbers' in js
            assert b'saveFromMap' in js
            assert b'checkForUpdates' in js
            assert len(z.read('assets/maplibre-gl.js'))>200_000
          print('PUBLIC_COLLECTOR_0_8_4_DEBUG_BUILD_VERIFIED')
          PY
          sha256sum "$APK"

      - name: Check whether protected official signing key is configured
        id: signing_gate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COLLECTOR_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.COLLECTOR_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'OFFICIAL_SIGNING_CONFIGURED'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'OFFICIAL_SIGNING_NOT_CONFIGURED; debug checks only, NO official APK published'
          fi

  release:
    name: Sign permanent official APK and publish to stable download
    needs: apk
    if: ${{ github.ref == 'refs/heads/main' && needs.apk.outputs.signing_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify official source identity and icon
        shell: bash
        run: |
          set -euo pipefail
          ICON=android-driver/address-collector/src/main/res/drawable-nodpi/svoi_collector_icon.png
          test "$(git hash-object "$ICON")" = 2940c67071b6431bbacce66556dc832fc7b7e4f1
          grep -F 'applicationId = "ru.svoitaxi.collector"' android-driver/address-collector/build.gradle.kts
          grep -F 'versionName = "0.8.4"' android-driver/address-collector/build.gradle.kts

      - name: Refuse to overwrite a published release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.8.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Official v0.8.4 release already exists; bump version/tag to publish future updates.'
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v4

      - name: Prepare release dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          npm install --ignore-scripts --no-audit --no-fund

      - name: Build official APK using protected, non-ephemeral signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.COLLECTOR_RELEASE_KEYSTORE_BASE64 }}
          SVOI_COLLECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.COLLECTOR_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export SVOI_COLLECTOR_RELEASE_STORE_FILE="$RUNNER_TEMP/svoi-collector-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$SVOI_COLLECTOR_RELEASE_STORE_FILE"
          unset KEYSTORE_BASE64
          test -s "$SVOI_COLLECTOR_RELEASE_STORE_FILE"
          keytool -list -keystore "$SVOI_COLLECTOR_RELEASE_STORE_FILE" \
            -storetype PKCS12 -storepass "$SVOI_COLLECTOR_RELEASE_STORE_PASSWORD" \
            -alias svoi-collector >/dev/null
          cd android-driver
          gradle :address-collector:assembleRelease --no-daemon --max-workers=2 --no-parallel

      - name: Verify correct official package, stable signing certificate and icon
        shell: bash
        run: |
          set -euo pipefail
          APK=android-driver/address-collector/build/outputs/apk/release/address-collector-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | tr '[:upper:]' '[:lower:]' \
            | grep -F '7f57730bcaa2648a725cf11264a8a2829fd0a16bc1d06e55ed1cefd4371b1063'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -F "package: name='ru.svoitaxi.collector' versionCode='12' versionName='0.8.4'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump resources "$APK" \
            | grep -F 'svoi_collector_icon'
          python3 - <<'PY'
          from zipfile import ZipFile
          p='android-driver/address-collector/build/outputs/apk/release/address-collector-release.apk'
          with ZipFile(p) as z:
            assets=z.namelist()
            for f in ('assets/collector.html','assets/collector.js','assets/team-sync.js','assets/maplibre-gl.js'):
              assert f in assets, f
            assert any(x.startswith('res/') and x.endswith('.png') for x in assets), 'Compiled Android PNG resources missing'
            js=z.read('assets/collector.js')
            assert b'renderHouseNumbers' in js
            assert b'saveFromMap' in js
          print('SVOI_OFFICIAL_COLLECTOR_APK_VERIFIED')
          PY
          install -d release
          cp "$APK" release/SVOI-Address-Collector.apk
          sha256sum release/SVOI-Address-Collector.apk

      - name: Publish versioned stable release and permanent driver download URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.8.4 release/SVOI-Address-Collector.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'СВОИ ТАКСИ — Сбор адресов 0.8.4' \
            --notes 'Версия 0.8.4: при запуске приложение проверяет официальные обновления и, только если доступна более новая версия, автоматически показывает окно с кнопками Обновить и Позже. Обновление загружается внутри сборщика и устанавливается с подтверждением Android. После Позже можно обновиться через прежний раздел. Адреса, ключи и работа карты сохраняются.' \
            --latest
          test -n "$(gh release view v0.8.4 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "SVOI-Address-Collector.apk") | .url')"
          echo 'SVOI_COLLECTOR_OFFICIAL_RELEASE_PUBLISHED'
          echo 'OFFICIAL_APK_URL=https://github.com/lan4u951337-coder/SVOI-ADDRESS-COLLECTOR/releases/latest/download/SVOI-Address-Collector.apk'
