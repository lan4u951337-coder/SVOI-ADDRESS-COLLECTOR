name: One-time import of verified SVOI Taxi launcher icon

on:
  push:
    branches:
      - chore/brand-icon-import-once
    paths:
      - .github/workflows/import-icon-once.yml

permissions:
  contents: write

jobs:
  import-official-icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Download original public SVOI Taxi icon and verify exact Git blob
        shell: bash
        run: |
          set -euo pipefail
          out=android-driver/address-collector/src/main/res/drawable-nodpi/svoi_collector_icon.png
          install -d "$(dirname "$out")"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            https://svoi-taxi24.ru/icons/driver-512.png -o "$out"
          test "$(stat -c %s "$out")" = 191987
          test "$(git hash-object "$out")" = 4c48e34bf05c12da6912184b091b875c73355840
          file "$out" | grep -F 'PNG image data'
          echo 'OFFICIAL_SVOI_LAUNCHER_ICON_VERIFIED'

      - name: Commit exact brand image to this isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- android-driver/address-collector/src/main/res/drawable-nodpi/svoi_collector_icon.png
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'assets: add verified original SVOI Taxi launcher icon'
          git push origin HEAD:chore/brand-icon-import-once
